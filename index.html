<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INTERIM | Astronaut Health Assessment &amp; Decision Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #E4E8E3; --panel: #F2F4F0; --ink: #141818; --mute: #56635C; --line: #A9B3AC;
      --accent: #30A6F8; --ok: #2B7A4B; --warn: #E9B949; --crit: #BF2A20; --hatch: rgba(191,42,32,.16);
      --font-d: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --font-m: 'IBM Plex Mono', ui-monospace, monospace;
      --font-b: 'IBM Plex Sans', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #001311; --panel: #151D1A; --ink: #DCE6E0; --mute: #8D9D95; --line: #33423B;
        --accent: #52C7DB; --ok: #5FC88A; --warn: #E9B949; --crit: #FF6B5E; --hatch: rgba(255,107,94,.18);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #001311; --panel: #151D1A; --ink: #DCE6E0; --mute: #8D9D95; --line: #33423B;
      --accent: #52C7DB; --ok: #5FC88A; --warn: #E9B949; --crit: #FF6B5E; --hatch: rgba(255,107,94,.18);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-b);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 6px 96px; margin: 0;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .app { max-width: 480px; margin: 0 auto; }
    h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }

    /* Masthead Header */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 10px; border-bottom: 2px solid var(--ink); }
    .mark { display: flex; align-items: center; gap: 10px; }
    .mark i { width: 24px; height: 24px; border: 3px solid var(--ink); border-right-color: transparent; border-radius: 50%; transform: rotate(-30deg); flex: none; }
    .mark b { display: block; font: 700 27px/1 var(--font-d); letter-spacing: .16em; }
    .mark small { display: block; font-size: 11px; line-height: 1.3; color: var(--mute); margin-top: 2px; }
    .sw { display: flex; align-items: center; gap: 8px; background: none; border: 0; min-height: 44px; padding: 0; cursor: pointer; }
    .sw span:first-child { font: 600 12px/1.15 var(--font-d); letter-spacing: .1em; text-align: right; text-transform: uppercase; }
    .sw .t { width: 46px; height: 24px; border: 2px solid var(--ink); background: var(--panel); position: relative; flex: none; border-radius: 12px; }
    .sw .t i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--ink); border-radius: 50%; transition: transform .15s; }
    .sw[aria-checked="true"] .t { background: var(--crit); border-color: var(--crit); }
    .sw[aria-checked="true"] .t i { transform: translateX(22px); background: #fff; }

    .strip { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font: 400 11.5px var(--font-m); color: var(--mute); padding: 6px 0; border-bottom: 1px solid var(--line); }
    .strip b { font-weight: 500; color: var(--ink); }
    .strip.lost, .strip.lost b { color: var(--crit); }
    .banner { margin-top: 10px; padding: 8px 10px; border: 1px dashed var(--crit); color: var(--crit); font: 500 12.5px/1.5 var(--font-m); background: repeating-linear-gradient(135deg, transparent 0 8px, var(--hatch) 8px 10px); }

    /* Common Components */
    .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 20px 0 8px; }
    .h h2 { font: 700 16px var(--font-d); letter-spacing: .14em; text-transform: uppercase; }
    .cnt { font: 400 12px var(--font-m); color: var(--mute); }
    .lab { font: 600 12px var(--font-d); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
    .panel { background: var(--panel); border: 1px solid var(--line); }
    .pad { padding: 12px; }
    .note { font-size: 12.5px; color: var(--mute); margin-top: 10px; }
    .btn { display: block; width: 100%; min-height: 52px; margin-top: 12px; background: var(--ink); color: var(--bg); border: 2px solid var(--ink); font-weight: 600; font-size: 16px; cursor: pointer; }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn:active { transform: translateY(1px); }
    .lnk { background: none; border: 0; padding: 6px 0; min-height: 36px; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 14px; }


    .body3d-wrap{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:10px;align-items:center}
    .body3d-stage{position:relative;min-height:250px;height:270px;background:radial-gradient(ellipse at center,rgba(48,166,248,.12),transparent 68%);border:1px solid var(--line);overflow:hidden;touch-action:pan-y}
    #body3d{width:100%;height:100%;display:block;cursor:grab}#body3d:active{cursor:grabbing}
    .body3d-hint{position:absolute;left:8px;bottom:7px;font:10px var(--font-m);color:var(--mute);pointer-events:none}
    .body3d-controls{display:grid;gap:6px}.body3d-part{min-height:42px;padding:6px 7px;border:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font:600 12px var(--font-d);letter-spacing:.05em}
    .body3d-part.active{border:2px solid var(--accent);background:rgba(48,166,248,.10);color:var(--accent)}
    .body3d-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.body3d-title small{color:var(--mute);font:10px var(--font-m)}
    @media(max-width:360px){.body3d-wrap{grid-template-columns:1fr 96px}.body3d-stage{height:235px}}

    .nav div { grid-template-columns: repeat(5,1fr); }
    .nav button { font-size: 11px; letter-spacing: .08em; }
    .section-intro { color:var(--mute); font-size:13px; margin:4px 0 12px; }
    .info-grid { display:grid; gap:8px; margin-top:10px; }
    .info-card { background:var(--panel); border:1px solid var(--line); padding:11px; }
    .info-card h3 { font:600 15px var(--font-d); letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; }
    .info-card p { font-size:12.5px; margin-top:5px; }
    .info-card b { color:var(--ink); }
    .risk-box { padding:11px; border:1px solid var(--line); background:var(--panel); margin:10px 0; }
    .risk-box[data-level="high"] { border-color:var(--crit); }
    .risk-box[data-level="caution"] { border-color:var(--warn); }
    .risk-box[data-level="low"] { border-color:var(--ok); }
    .risk-label { font:600 12px var(--font-d); letter-spacing:.12em; text-transform:uppercase; }
    .risk-box p { font-size:12.5px; margin-top:4px; }
    .mini-label { font:500 10px var(--font-m); color:var(--mute); letter-spacing:.06em; text-transform:uppercase; }
    .guide-list { padding-left:18px; margin-top:7px; }
    .guide-list li { padding:3px 0; font-size:12.5px; }
    .health-form { display:grid; gap:9px; margin-top:10px; }
    .health-form label { display:grid; gap:4px; font-size:13px; }
    .health-form select { width:100%; min-height:42px; background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:7px; }
    .trend-grid { display:grid; gap:10px; margin-top:12px; }
    .trend-card { background:var(--panel); border:1px solid var(--line); padding:11px; }
    .trend-head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
    .trend-head b { font:600 14px var(--font-d); letter-spacing:.08em; text-transform:uppercase; }
    .trend-value { font:500 18px var(--font-m); }
    .trend-svg { width:100%; height:66px; display:block; margin-top:5px; }
    .trend-svg path { fill:none; stroke:var(--accent); stroke-width:2; }
    .trend-svg line { stroke:var(--line); stroke-width:1; stroke-dasharray:3 3; }
    .empty-trend { border:1px dashed var(--line); padding:14px; color:var(--mute); font-size:13px; margin-top:10px; }
    .disclaimer-small { font-size:11px; color:var(--mute); margin-top:9px; }
    @media(max-width:360px) { .nav button {font-size:10px;letter-spacing:.02em;} }

    /* Scenario List */
    .slist { list-style: none; padding: 0; border-top: 2px solid var(--ink); }
    .row { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; min-height: 68px; cursor: pointer; }
    .row:hover { background: var(--panel); }
    .row .id { font: 500 13px var(--font-m); color: var(--mute); }
    .row .hz { display: block; font: 600 11px var(--font-d); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
    .row .ttl { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
    .row .sub { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.4; margin-top: 2px; }
    .rt { display: grid; justify-items: end; gap: 4px; }
    .dl { font: 400 11.5px var(--font-m); color: var(--mute); white-space: nowrap; }
    .badge { font: 500 11.5px var(--font-m); border: 1px solid var(--line); padding: 1px 6px; white-space: nowrap; color: var(--mute); }
    .badge[data-v="match"], .badge[data-v="ok"] { color: var(--ok); border-color: var(--ok); }
    .badge[data-v="late"] { color: var(--crit); border-color: var(--crit); }
    .badge[data-v="over"] { color: var(--warn); border-color: var(--warn); }
    .addrow { width: 100%; margin-top: 10px; min-height: 48px; background: none; border: 2px dashed var(--line); font-weight: 600; cursor: pointer; color: var(--mute); }
    .addrow:hover { border-color: var(--ink); color: var(--ink); }
    .how { margin-top: 20px; font-size: 13px; color: var(--mute); }
    .how b { color: var(--ink); }

    /* Run View & Vitals */
    .runtop { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .tag { font: 500 11.5px var(--font-m); color: var(--mute); letter-spacing: .04em; text-transform: uppercase; }
    .scard { margin-top: 6px; padding: 12px; background: var(--panel); border: 1px solid var(--line); }
    .met { font: 400 11.5px var(--font-m); color: var(--mute); }
    .scard h1 { font: 600 22px/1.25 var(--font-b); margin: 4px 0 6px; text-wrap: balance; }
    .scard p { font-size: 14.5px; }
    .vit { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 10px; }
    .v { background: var(--panel); padding: 9px 12px 8px; min-width: 0; }
    .v .val { display: flex; align-items: baseline; gap: 5px; margin: 0 4px; }
    .v b { font: 500 30px/1 var(--font-m); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .v u { text-decoration: none; font: 400 11px var(--font-m); color: var(--mute); }
    .v .meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .st { font: 500 11.5px var(--font-m); white-space: nowrap; }
    .st::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border: 2px solid currentColor; }
    .v[data-s="ok"] { color: var(--ink); }
    .v[data-s="ok"] .st { color: var(--ok); }
    .v[data-s="warn"] .st, .v[data-s="warn"] b { color: var(--warn); }
    .v[data-s="warn"] .st::before { background: currentColor; }
    .v[data-s="crit"] .st, .v[data-s="crit"] b { color: var(--crit); }
    .v[data-s="crit"] .st::before { background: currentColor; transform: rotate(45deg); }
    .spark { width: 60px; height: 18px; flex: none; overflow: visible; }
    .spark path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
    .v[data-s="ok"] .spark { color: var(--ok); }
    .v[data-s="warn"] .spark { color: var(--warn); }
    .v[data-s="crit"] .spark { color: var(--crit); }

    /* Choices List */
    .choices { list-style: none; padding: 0; display: grid; gap: 8px; }
    .ch { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 12px; align-items: center; width: 100%; text-align: left; min-height: 62px; background: var(--panel); border: 2px solid var(--ink); padding: 9px 12px; cursor: pointer; }
    .ch:hover, .ch:active { background: var(--ink); color: var(--bg); }
    .ch .k { width: 30px; height: 30px; border: 2px solid currentColor; display: grid; place-items: center; font: 500 14px var(--font-m); }
    .ch .n { display: block; font-weight: 600; font-size: 17px; }
    .ch .d { display: block; font-size: 12.5px; opacity: .75; line-height: 1.4; }

    /* Timer & Budget */
    .comm, .bud { padding: 12px; margin-top: 10px; }
    .cdrow { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 10px; }
    .cd { font: 500 46px/1 var(--font-m); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .cdl { font-size: 12.5px; color: var(--mute); line-height: 1.35; padding-bottom: 4px; }
    .bar { height: 14px; border: 1px solid var(--ink); background: var(--bg); position: relative; overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .3s; }
    .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--line) calc(10% - 1px) 10%); }
    .bar.b { height: 18px; margin-top: 8px; }
    .bar.b[data-s="ok"] i { background: var(--ok); }
    .bar.b[data-s="warn"] i { background: var(--warn); }
    .bar.b[data-s="crit"] i { background: var(--crit); }
    .bn { float: right; font: 500 12px var(--font-m); color: var(--ink); letter-spacing: 0; text-transform: none; }
    .crow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 13.5px; }
    .cb { display: flex; gap: 14px; }

    .comm.dead { border: 2px dashed var(--crit); }
    .comm.dead .cd { color: var(--crit); animation: blink 1.6s steps(2,jump-none) infinite; }
    .comm.dead .lab { color: var(--crit); }
    .bar.dead { border-style: dashed; border-color: var(--crit); background: repeating-linear-gradient(135deg, var(--panel) 0 6px, var(--hatch) 6px 12px); }
    .bar.dead i, .bar.dead::after { display: none; }
    @keyframes blink { 50% { opacity: .35; } }

    .mini { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .mini button { min-height: 46px; background: var(--panel); border: 1px solid var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; padding: 0 2px; }
    .mini button[disabled] { background: var(--ink); color: var(--bg); cursor: default; }

    /* Results */
    .cmp { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); background: var(--panel); }
    .cmp > div { padding: 11px 12px; min-width: 0; }
    .cmp > div + div { border-left: 2px solid var(--ink); }
    .cmp .big { font: 600 24px/1.2 var(--font-b); margin: 4px 0 6px; overflow-wrap: anywhere; }
    .cmp p { font-size: 13.5px; line-height: 1.5; margin-top: 8px; color: var(--mute); }
    .cmp dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 10px; font: 400 12px var(--font-m); color: var(--mute); }
    .cmp dd { text-align: right; color: var(--ink); }
    .cmp.nosig { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--hatch) 8px 10px); margin: -11px -12px; padding: 11px 12px; height: calc(100% + 22px); }
    .cmp.nosig .big { color: var(--crit); font-family: var(--font-m); font-size: 20px; }

    .verdict { margin-top: 10px; padding: 10px 12px; border: 2px solid; font-weight: 600; }
    .verdict[data-v="match"], .verdict[data-v="ok"] { color: var(--ok); }
    .verdict[data-v="late"] { color: var(--crit); }
    .verdict[data-v="under"], .verdict[data-v="over"] { color: var(--warn); }
    .verdict span { display: block; font-weight: 400; font-size: 13px; color: var(--ink); margin-top: 2px; }

    .steps { list-style: none; padding: 0; border-top: 2px solid var(--ink); }
    .step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
    .step input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--ink); background: var(--panel); display: grid; place-items: center; cursor: pointer; }
    .step input:checked { background: var(--ink); }
    .step input:checked::after { content: ""; width: 12px; height: 6px; border-left: 3px solid var(--bg); border-bottom: 3px solid var(--bg); transform: rotate(-45deg) translate(1px,-1px); }
    .step b { display: block; font-size: 15px; }
    .step span span { display: block; font-size: 13px; color: var(--mute); }
    .step input:checked + span { opacity: .55; }
    .esc { margin-top: 10px; padding: 9px 12px; border: 1px solid var(--crit); color: var(--crit); font-size: 13px; }
    .rec { border: 2px solid var(--accent); padding: 9px 12px; margin-top: 6px; }
    .rec b { display: block; }
    .rec p { font-size: 13px; color: var(--mute); margin-top: 2px; }

    /* Log & Profile */
    .logrow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .logrow time { font: 400 11.5px var(--font-m); color: var(--mute); }
    .logrow .t { font-weight: 600; }
    .logrow .s { font-size: 13px; color: var(--mute); }
    .logrow .r { text-align: right; font: 500 12px var(--font-m); color: var(--mute); }
    .pill { display: inline-block; font: 500 10.5px var(--font-m); border: 1px solid var(--mute); padding: 0 5px; margin-left: 6px; color: var(--mute); vertical-align: 1px; }
    .pill.red { color: var(--crit); border-color: var(--crit); }
    .ptype { font: 600 30px/1.2 var(--font-b); margin: 6px 0 8px; text-wrap: balance; }
    .gauge { position: relative; height: 30px; margin: 18px 0 4px; border-block: 2px solid var(--ink); background: repeating-linear-gradient(90deg, transparent 0 calc(12.5% - 1px), var(--line) calc(12.5% - 1px) 12.5%); }
    .gauge::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid var(--ink); }
    .gauge .dot { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px; background: var(--crit); }
    .gl { display: flex; justify-content: space-between; gap: 6px; font: 500 11px var(--font-m); color: var(--mute); }
    .dist { display: grid; grid-template-columns: 92px 1fr 24px; gap: 10px; align-items: center; margin-top: 8px; font-size: 13.5px; }
    .dist .bar { height: 12px; }
    .dist .bar i { background: var(--ink); }
    .dist em { font: 500 12px var(--font-m); font-style: normal; text-align: right; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 14px; }
    .stats div { background: var(--panel); padding: 8px 10px; }
    .stats b { display: block; font: 500 22px var(--font-m); }
    .stats span { font-size: 12px; color: var(--mute); }

    /* Form */
    .f { display: grid; gap: 12px; }
    .f label { display: grid; gap: 4px; }
    .f input, .f select, .f textarea { width: 100%; min-height: 44px; background: var(--panel); color: var(--ink); border: 2px solid var(--ink); padding: 8px 10px; font: inherit; border-radius: 0; }
    .f textarea { min-height: 84px; resize: vertical; }
    .f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Bottom Nav */
    .nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--ink); padding: 0 max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-right, 0px)); }
    .nav div { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3,1fr); }
    .nav button { background: none; border: 0; min-height: 54px; cursor: pointer; font: 600 13px var(--font-d); letter-spacing: .14em; text-transform: uppercase; }
    .nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }

    /* 身体部位高亮动画样式 */
    .body-map-container { text-align: center; margin: 10px 0; }
    .human-body-svg { height: 120px; }
    .pulse-spot { fill: var(--crit); opacity: 0.8; animation: pulse 1.2s infinite ease-in-out; display: none; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 1; fill: var(--crit); }
      100% { transform: scale(1); opacity: 0.4; }
    }
    /* Body Map 点击高亮样式 */
    .body-part-clickable { fill: var(--line); opacity: 0.5; transition: all .2s; }
    .body-part-clickable:hover { fill: var(--accent); opacity: 0.9; }
    .body-part-clickable.active { fill: var(--crit); opacity: 1; }
    .daily-check { background: var(--panel); border: 1px solid var(--accent); padding: 12px; margin-bottom: 16px; }
    .daily-check h3 { font: 600 14px var(--font-d); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }

  function vitHTML() {

  var INDICATORS = {
    hr: {what:'Heart rate is the number of heartbeats per minute.', why:'It helps show how the cardiovascular system is responding to activity or stress.', space:'Exercise, workload, stress, hydration and spaceflight-related fluid shifts can influence heart rate. A single reading does not identify a cause.'},
    spo2: {what:'SpO₂ is an estimate of the percentage of haemoglobin carrying oxygen.', why:'It helps monitor oxygenation alongside symptoms and other measurements.', space:'The reading can be affected by sensor fit, movement, circulation and equipment conditions. Check the measurement quality before interpreting it.'},
    bp: {what:'Blood pressure describes the force of blood against artery walls. This scenario records a simplified systolic value.', why:'It can help identify changes in circulation, especially when considered with posture and symptoms.', space:'Fluid shifts, hydration, posture and adaptation to altered gravity can affect cardiovascular responses. The displayed diastolic value is an illustrative estimate, not a separate measurement.'},
    sleep: {what:'Sleep duration is the amount of time spent asleep during the previous sleep period.', why:'Sleep supports attention, reaction time, mood and day-to-day functioning.', space:'Shift schedules, lighting, noise, workload and disrupted routines can affect sleep during missions.'},
    mood: {what:'Mood is a self-reported check-in on how the person feels.', why:'A regular check-in can help notice changes over time and prompt a conversation when concerns persist.', space:'Isolation, workload, disrupted sleep and distance from family can affect well-being. A score alone is not a mental-health diagnosis.'},
    rhr: {what:'Resting heart rate is the number of heartbeats per minute while resting.', why:'Tracking it over time can help identify changes from a person’s usual pattern.', space:'Sleep, stress, hydration, illness, exercise and adaptation to spaceflight may influence the reading.'},
    pvt: {what:'PVT is a reaction-time task; this scenario records response time in milliseconds.', why:'It is used as one way to observe alertness and sustained attention.', space:'Sleep loss, circadian disruption and workload can affect reaction time. One result should be interpreted in context.'},
    co2: {what:'Cabin CO₂ is the carbon-dioxide level measured in the cabin environment. Elevated CO₂ is a hypercapnia-related environmental concern; it is not the same as hypoxia (insufficient oxygen in body tissues).', why:'It helps assess cabin air quality and whether ventilation or carbon-dioxide removal needs attention.', space:'A high reading can point to an environmental-system issue. Headache is non-specific, so the reading and symptoms should be assessed together. SpO₂ and CO₂ are different measurements.'},
    head: {what:'Headache severity is a self-reported symptom score from 0 to 10.', why:'Tracking severity and changes can help communicate whether symptoms are improving or worsening.', space:'Headache can have many causes, including environmental conditions, sleep loss, dehydration or elevated CO₂. The score does not identify the cause.'},
    pain: {what:'Chest-pain severity is a self-reported score from 0 to 10.', why:'Chest discomfort with other symptoms or abnormal measurements needs prompt attention.', space:'Do not assume chest pain is caused by exercise or stress. This simulation treats concerning chest pain as requiring urgent crew assessment.'},
    nau: {what:'Nausea severity is a self-reported score from 0 to 10.', why:'It helps track symptom intensity and whether it is changing.', space:'Motion, workload, medication, illness and other factors may contribute. Nausea after EVA should be assessed with the full mission context.'},
    ery: {what:'Skin redness is a visual symptom observation recorded as an estimated percentage in this scenario.', why:'A change in skin appearance should be documented with timing, location and other symptoms.', space:'Irritation, pressure, temperature and other factors can affect skin appearance. This simulation does not determine the cause.'},
    dose: {what:'A dosimeter records radiation exposure over time; the scenario shows a cumulative value in mSv.', why:'Exposure records help the crew compare readings with mission procedures and radiation-protection guidance.', space:'Exposure depends on mission conditions, shielding, location and time. A dose reading is not by itself a diagnosis of radiation sickness.'},
    dz: {what:'Dizziness severity is a self-reported score from 0 to 10.', why:'It is important to note when it occurs, especially with standing, faintness or changes in blood pressure.', space:'Posture and fluid shifts can affect circulation. Dizziness with fainting, chest pain or worsening symptoms needs prompt crew attention.'},
    pac: {what:'Ectopic beats are extra or early heartbeats recorded per minute in this scenario.', why:'A change in rhythm should be considered together with symptoms, heart rate and ECG assessment.', space:'Stress, sleep loss, stimulants and other conditions can influence palpitations. This display is a simulation, not an ECG diagnosis.'}
  };

  function assessmentHTML(sc, values) {

        space: 'Interpret it with the full situation and mission procedures; this reading alone does not identify a diagnosis.'

        '<p><b>What can affect it in space?</b> ' + esc(info.space) + '</p>' +
        '<p><b>Scenario flag:</b> ' + (state === 'crit' ? 'Outside this scenario’s critical reference band.' : state === 'warn' ? 'Outside this scenario’s usual band.' : 'Within this scenario’s reference band.') + '</p></article>';
    }).join('');
    var level = critical >= 2 ? 'high' : critical === 1 ? 'caution' : caution ? 'caution' : 'low';

      '<div class="risk-box" data-level="' + level + '"><div class="risk-label">' + label + '</div><p>' + esc(summary) + '</p>' +

      '<div class="info-grid">' + cards + '</div>';

  function trendPath(vals) {
    if (!vals.length) return '';
    var nums = vals.map(function(x) { return +x.value; });
    var min = Math.min.apply(null, nums), max = Math.max.apply(null, nums);
    if (max === min) { min -= 1; max += 1; }
    return nums.map(function(y, i) {
      var x = vals.length === 1 ? 50 : 4 + i / (vals.length - 1) * 92;
      var py = 54 - ((y - min) / (max - min)) * 46;
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + py.toFixed(1);
    }).join(' ');
  }

  function trendsHTML() {
    var groups = {};
    S.log.slice().reverse().forEach(function(entry) {
      (entry.vitals || []).forEach(function(v) {
        if (!groups[v.key]) groups[v.key] = {label:v.label, unit:v.unit, points:[]};
        groups[v.key].points.push({value:v.value, ts:entry.ts, title:entry.title});
      });
    });
    var checkins = S.checkins.slice().reverse();
    if (checkins.length) {
      groups.sleepCheck = {label:'Sleep duration',unit:'hours',points:checkins.map(function(c){return {value:c.sleep,ts:c.ts,title:'Daily check-in'};})};
      groups.moodCheck = {label:'Mood check-in',unit:'/10',points:checkins.map(function(c){return {value:c.mood,ts:c.ts,title:'Daily check-in'};})};
    }
    var keys = Object.keys(groups);
    var charts = keys.map(function(k) {
      var g = groups[k], pts = g.points.slice(-10), last = pts[pts.length - 1];
      return '<article class="trend-card"><div class="trend-head"><b>' + esc(g.label) + '</b><span class="trend-value">' + esc(String(last.value)) + ' <small>' + esc(g.unit) + '</small></span></div>' +
        '<svg class="trend-svg" viewBox="0 0 100 60" preserveAspectRatio="none" role="img" aria-label="' + esc(g.label) + ' trend"><line x1="0" y1="54" x2="100" y2="54"></line><path d="' + trendPath(pts) + '"></path></svg>' +
        '<div class="mini-label">' + pts.length + ' recorded point(s) · latest ' + new Date(last.ts).toLocaleDateString() + '</div></article>';
    }).join('');
    return '<div class="h"><h2>Health history</h2><span class="cnt">' + keys.length + ' indicators</span></div>' +
      '<p class="section-intro">Trends are built from completed simulation snapshots and saved daily check-ins on this device. A chart appears after data has been recorded for that indicator.</p>' +

    var bodyStyle = part === 'body' ? 'style="display:block;"' : '';

    return '<div class="runtop"><button class="lnk" data-a="exit">← ' + (r.phase === 'wait' ? 'Abandon' : 'Back') + '</button><span class="tag">' + h[0] + ' ' + h[1] + '</span></div>' +
      '<section class="scard"><div class="met">' + esc(sc.met) + ' · ground delay ' + sc.delay + ' min</div><h1>' + esc(sc.title) + '</h1><p>' + esc(sc.brief) + '</p>' +
      '<div class="body-map-container">' +
      '<svg viewBox="0 0 100 200" class="human-body-svg">' +
      '<path d="M50 15 C55 15 58 20 58 28 C58 35 55 40 50 40 C45 40 42 35 42 28 C42 20 45 15 50 15 Z M42 42 L58 42 L68 90 L58 90 L58 140 L52 190 L48 190 L42 140 L42 90 L32 90 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>' +
      '<circle id="highlight-head" cx="50" cy="28" r="10" class="pulse-spot" ' + headStyle + ' />' +
      '<circle id="highlight-chest" cx="50" cy="60" r="12" class="pulse-spot" ' + chestStyle + ' />' +
      '<rect id="highlight-body" x="30" y="15" width="40" height="175" rx="10" class="pulse-spot" ' + bodyStyle + ' />' +
      '</svg></div>' +
      '</section>' +
      '<section class="vit" id="vit">' + vitHTML() + '</section><section id="phase">' + ph + '</section>';
  }

  function logHTML() {
    var L = S.log;
    var rows = L.length ? L.map(function(e) {
      var d = new Date(e.ts), t = d.toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}), h = HAZ[e.hz] || HAZ[0];
      return '<li class="logrow"><div><time>' + t + ' · ' + h[1] + '</time><div class="t">' + esc(e.title) + (e.blk ? '<span class="pill red">BLACKOUT</span>' : '') + (e.demo ? '<span class="pill">DEMO</span>' : '') + (e.aided ? '<span class="pill">AIDED</span>' : '') + '</div>' +
        '<div class="s">You chose "' + ACTS[e.c].n + '", advised "' + ACTS[e.ideal].n + '" · ' + VT[e.v] + '</div></div>' +
        '<div class="r">budget<br>' + e.budget + '</div></li>';
    }).join('') : '<li class="note" style="padding:14px 0">Nothing logged yet. Complete a scenario to save your first decision.</li>';
    return '<div class="h"><h2>Decision log</h2><span class="cnt">' + L.length + ' entries</span></div><ol class="slist">' + rows + '</ol>' +
      (L.length ? '<button class="btn ghost" data-a="clear">' + (S.armClear ? 'Tap again to confirm' : 'Clear log') + '</button>' : '');
  }

  function profHTML() {
    var p = prof(), n = S.log.filter(function(e) { return !e.aided; }).length;
    var profile = '';
    if (!p) {
      profile = '<div class="h"><h2>Decision profile</h2></div><div class="panel pad"><p>Finish at least 3 scenarios to generate a profile. You have ' + n + ' so far.</p><div class="bar" style="margin-top:10px"><i style="width:' + Math.min(100, n / 3 * 100) + '%"></i></div></div>' +
        '<p class="note">Complete at least 3 real scenarios to generate your decision profile. Your completed scenarios will appear in the Log.</p>';
    } else {
      var pos = Math.max(-2, Math.min(2, p.avg)), pct = (pos + 2) / 4 * 100;
      profile = '<div class="h"><h2>Decision profile</h2><span class="cnt">from ' + p.n + ' decisions</span></div>' +
        '<div class="panel pad"><div class="lab">Your type</div><div class="ptype">' + p.title + '</div><p>' + p.text + '</p>' +
        '<div class="gauge" role="img" aria-label="Average bias ' + sg(p.avg) + ' levels"><i class="dot" style="left:' + pct + '%"></i></div><div class="gl"><span>- Over-waiting</span><span>Calibrated</span><span>Over-reacting +</span></div>' +
        '<div class="stats"><div><b>' + Math.round(p.good / p.n * 100) + '%</b><span>Matched ground</span></div><div><b>' + p.late + '</b><span>Too slow</span></div><div><b>' + p.over + '</b><span>Overreactions</span></div></div></div>';
    }
    return profile + trendsHTML();
  }

  function newHTML() {
    var o = HAZ.map(function(h, i) { return '<option value="' + i + '">' + h[0] + ' ' + h[2] + '</option>'; }).join('');
    var a = ACTS.map(function(x, i) { return '<option value="' + i + '"' + (i === 2 ? ' selected' : '') + '>' + x.n + '</option>'; }).join('');
    return '<div class="h"><h2>New scenario</h2></div><form class="f" id="nf">' +
      '<label><span class="lab">Title</span><input id="f-t" maxlength="60" placeholder="e.g. Abdominal pain + fever"></label>' +
      '<label><span class="lab">Symptoms</span><textarea id="f-b" maxlength="220" placeholder="What happened"></textarea></label>' +
      '<label><span class="lab">Hazard</span><select id="f-h">' + o + '</select></label>' +
      '<div class="two"><label><span class="lab">Heart rate bpm</span><input id="f-hr" type="number" value="108"></label><label><span class="lab">SpO2 %</span><input id="f-sp" type="number" value="95"></label></div>' +
      '<div class="two"><label><span class="lab">Systolic mmHg</span><input id="f-bp" type="number" value="110"></label><label><span class="lab">Discomfort /10</span><input id="f-d" type="number" value="5"></label></div>' +
      '<div class="two"><label><span class="lab">Ground delay (min)</span><input id="f-dl" type="number" value="10"></label><label><span class="lab">Ground would say</span><select id="f-i">' + a + '</select></label></div>' +
      '<button class="btn" type="submit">Create scenario</button><button class="btn ghost" type="button" data-a="cancel" style="margin-top:0">Cancel</button></form>';
  }

  function init3DBody() {
    var canvas=$('#body3d'); if(!canvas||!window.THREE)return;
    var T=window.THREE,w=canvas.clientWidth||250,h=canvas.clientHeight||270;
    var scene=new T.Scene();scene.background=new T.Color(0x182421);
    var camera=new T.PerspectiveCamera(34,w/h,.1,100);camera.position.set(0,1.0,7.4);
    var renderer;try{renderer=new T.WebGLRenderer({canvas:canvas,antialias:true});}catch(e){canvas.parentNode.innerHTML='<p class="note" style="padding:20px">3D is unavailable in this browser. Use the body-part buttons instead.</p>';return;}
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(w,h,false);
    scene.add(new T.HemisphereLight(0xe5f2ff,0x35443d,1.8));
    var key=new T.DirectionalLight(0xffffff,2);key.position.set(3,5,6);scene.add(key);
    var rim=new T.DirectionalLight(0x30a6f8,1.2);rim.position.set(-4,2,-4);scene.add(rim);
    var model=new T.Group();scene.add(model);var clickable=[];
    var skin=new T.MeshStandardMaterial({color:0xc99478,roughness:.72}),suit=new T.MeshStandardMaterial({color:0xdce5df,roughness:.8}),blue=new T.MeshStandardMaterial({color:0x30a6f8,roughness:.5}),dark=new T.MeshStandardMaterial({color:0x263b3a});
    function mesh(geo,mat,x,y,z,sx,sy,sz,zone){var m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx||1,sy||1,sz||1);model.add(m);if(zone){m.userData.zone=zone;clickable.push(m);}return m;}
    function ball(x,y,z,sx,sy,sz,mat,zone){return mesh(new T.SphereGeometry(1,28,20),mat,x,y,z,sx,sy,sz,zone);}
    function limb(a,b,r,mat,zone){var A=new T.Vector3(...a),B=new T.Vector3(...b),d=new T.Vector3().subVectors(B,A),len=d.length();var m=mesh(new T.CylinderGeometry(r,r,len,18),mat,(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2,1,1,1,zone);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());ball(...a,r,r,r,mat,zone);ball(...b,r,r,r,mat,zone);}
    ball(0,2.05,0,.46,.55,.40,skin,'head');ball(0,2.08,.34,.30,.33,.12,dark,'head');limb([0,1.52,0],[0,1.68,0],.18,skin,'head');
    ball(0,.82,0,.72,.76,.39,suit,'chest');ball(0,.91,.35,.42,.43,.10,blue,'chest');
    ball(0,-.08,0,.46,.45,.34,suit,'body');limb([-.22,-.35,0],[-.27,-1.35,0],.20,suit,'body');limb([.22,-.35,0],[.27,-1.35,0],.20,suit,'body');
    limb([-.62,1.28,0],[-.92,.38,0],.16,suit,'chest');limb([.62,1.28,0],[.92,.38,0],.16,suit,'chest');
    ball(-.94,.25,0,.16,.20,.16,skin,'chest');ball(.94,.25,0,.16,.20,.16,skin,'chest');
    ball(-.2,.92,.45,.07,.07,.03,dark,null);ball(.2,.92,.45,.07,.07,.03,dark,null);
    model.rotation.y=-.12;
    var ray=new T.Raycaster(),mouse=new T.Vector2(),down=null,moved=false;
    canvas.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY,ry:model.rotation.y};moved=false;});
    canvas.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;if(moved){model.rotation.y=down.ry+dx*.012;model.rotation.x=Math.max(-.22,Math.min(.22,dy*.003));}});
    canvas.addEventListener('pointerup',function(e){if(!down)return;if(!moved){var r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height*2-1);ray.setFromCamera(mouse,camera);var hits=ray.intersectObjects(clickable,false);if(hits.length){S.bodyFilter=hits[0].object.userData.zone;render();}}down=null;});
    canvas.addEventListener('pointerleave',function(){down=null;});
    function draw(){if(!document.body.contains(canvas))return;requestAnimationFrame(draw);renderer.render(scene,camera);}draw();
  }

  function render() {
    var v = S.view;
    $('#app').innerHTML = topHTML() + (v === 'home' ? homeHTML() : v === 'health' ? healthHTML() : v === 'log' ? logHTML() : v === 'profile' ? profHTML() : v === 'new' ? newHTML() : runHTML());
    var nav = $('#nav'); nav.hidden = (v === 'run' || v === 'new');
    nav.querySelectorAll('button').forEach(function(b) {
      if (b.dataset.v === v) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    if (v === 'run') live();
    if (v === 'home') init3DBody();
  }

  function num(id, lo, hi, d) {
    var x = parseFloat($(id).value); if (isNaN(x)) x = d; return Math.max(lo, Math.min(hi, x));
  }

 document.addEventListener('click', function(e) {
  var t = e.target.closest('[data-a]'); if (!t) return;
  var a = t.dataset.a, v = t.dataset.v;
  
  if (a === 'tab') { 
    S.run = null; S.view = v; S.armClear = false; 
    render(); window.scrollTo(0, 0); 
  }
  else if (a === 'open') { 
    startRun(findSc(v)); // ✅ 修复：传入了正确的场景 ID v
  }
  else if (a === 'blk') { 
    S.blackout = !S.blackout; render(); 
  }
  else if (a === 'choose') { 
    send('CHOOSE', +v); 
  }
  else if (a === 'aid') { 
    if (S.run && S.run.phase === 'brief') { S.run.aided = true; render(); } 
  }
  else if (a === 'swap') { 
    var r = S.run; 
    if (r && r.phase === 'wait' && +v !== r.cur) { // ✅ 修复：将 tv 改为 +v
      r.changes.push(+v); 
      r.ticks = {}; 
      setSeg(+v); 
      render(); 
    } 
  }
  else if (a === 'spd') { 
    S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; render(); 
  }
  else if (a === 'skip') {
    if (S.run && S.run.phase === 'wait') send('REPLY');
  }
  else if (a === 'end' || a === 'complete') {
    send(S.blackout ? 'END' : 'REPLY', S.blackout ? 'manual' : 'reply');
  }
  else if (a === 'exit') {
    if (S.run && S.run.phase !== 'result' && S.run.first !== null) {}
    S.run = null;
    S.view = 'home';
    render();
    window.scrollTo(0, 0);
  }
  else if (a === 'filter-body') { 
    S.bodyFilter = v; render(); 
  }
  else if (a === 'filter-clear') { 
    S.bodyFilter = null; render(); 
  }
  else if (a === 'save-checkin') {
    var sl = $('#check-sleep'), mo = $('#check-mood');
    if (sl && mo) {
      S.checkins.unshift({ts:Date.now(), sleep:+sl.value, mood:+mo.value});
      if (S.checkins.length > 60) S.checkins.length = 60;
      save();
      render();
      window.scrollTo(0, 0);
    }
  }
  else if (a === 'sleep-good') {
    S.wakeCheckin = {ts:Date.now(), status:'good'};
    save();
    render();
  }
  else if (a === 'sleep-bad') {
    // Bad sleep check-in opens the Insomnia + low mood scenario directly.
    startRun(findSc('s2'));
  }
  else if (a === 'new') { 
    S.view = 'new'; render(); window.scrollTo(0, 0); 
  }
  else if (a === 'cancel') { 
    S.view = 'home'; render(); 
  }
  else if (a === 'clear') {
    if (S.armClear) { 
      S.log = []; S.armClear = false; save(); render(); 
    } else { 
      S.armClear = true; render(); 
      setTimeout(function() { 
        if (S.armClear) { S.armClear = false; if (S.view === 'log') render(); } 
      }, 3000); 
    }
  }

});

document.addEventListener('change', function(e) {
    var t = e.target;
    // 检查是否点中了 Action Checklist 里的步骤
    if (t.matches && t.matches('.step input[data-i]') && S.run && S.run.phase === 'wait') {
      var idx = t.dataset.i;
      // 如果还没勾选过，并且当前是被勾选状态
      if (!S.run.ticks[idx] && t.checked) {
        S.run.ticks[idx] = true;
        t.disabled = true; // 锁定输入框，防止重复点击刷分
        
        // 核心新功能：每完成一步 SOP 自救，实时恢复 +5% 身体预算
        S.run.budget = Math.min(100, S.run.budget + 5);
        var bBar = $('#bBar'), bv = $('#bv');
        if (bBar) bBar.style.width = S.run.budget + '%';
        if (bv) bv.textContent = Math.round(S.run.budget);
      }
    }
  });

  document.addEventListener('submit', function(e) {
    if (e.target.id !== 'nf') return; e.preventDefault();
    var f = {
      id: 'c' + Date.now(), hz: +$('#f-h').value, title: $('#f-t').value.trim() || 'Custom scenario ' + (S.custom.length + 1),
      brief: $('#f-b').value.trim(), hr: num('#f-hr', 30, 200, 108), spo2: num('#f-sp', 60, 100, 95),
      sbp: num('#f-bp', 50, 220, 110), dis: num('#f-d', 0, 10, 5), delay: num('#f-dl', 8, 20, 10), ideal: +$('#f-i').value
    };
    S.custom.push(f); save(); S.view = 'home'; render(); window.scrollTo(0, 0);
  });

  render();
  })();
  </script>
</body>
</html>
