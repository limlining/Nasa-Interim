<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Interim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one handheld column, like a flight data file. Procedure-sheet rows, instrument readouts divided by hairlines, a status strip under the masthead. */
:root{
  --bg:#E4E8E3; --panel:#F2F4F0; --ink:#141B18; --mute:#56635C; --line:#A9B3AC;
  --accent:#0A6F83; --ok:#2B7A4B; --warn:#9A6200; --crit:#BF2A20; --hatch:rgba(191,42,32,.16);
  --font-d:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --font-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --panel:#151D1A; --ink:#DCE6E0; --mute:#8D9D95; --line:#33423B;
  --accent:#52C7DB; --ok:#5FC88A; --warn:#E9B949; --crit:#FF6B5E; --hatch:rgba(255,107,94,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --panel:#151D1A; --ink:#DCE6E0; --mute:#8D9D95; --line:#33423B;
  --accent:#52C7DB; --ok:#5FC88A; --warn:#E9B949; --crit:#FF6B5E; --hatch:rgba(255,107,94,.18); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 96px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}

/* masthead */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 10px;border-bottom:2px solid var(--ink)}
.mark{display:flex;align-items:center;gap:10px}
.mark i{width:24px;height:24px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;transform:rotate(-30deg);flex:none}
.mark b{display:block;font:700 27px/1 var(--font-d);letter-spacing:.16em}
.mark small{display:block;font-size:11px;line-height:1.3;color:var(--mute);margin-top:2px}
.sw{display:flex;align-items:center;gap:8px;background:none;border:0;min-height:44px;padding:0;cursor:pointer}
.sw span:first-child{font:600 12px/1.15 var(--font-d);letter-spacing:.1em;text-align:right;text-transform:uppercase}
.sw .t{width:46px;height:24px;border:2px solid var(--ink);background:var(--panel);position:relative;flex:none}
.sw .t i{position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--ink);transition:transform .15s}
.sw[aria-checked="true"] .t{background:var(--crit);border-color:var(--crit)}
.sw[aria-checked="true"] .t i{transform:translateX(22px);background:#fff}
.strip{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font:400 11.5px var(--font-m);color:var(--mute);padding:6px 0;border-bottom:1px solid var(--line)}
.strip b{font-weight:500;color:var(--ink)}
.strip .lost,.strip .lost b{color:var(--crit)}
.banner{margin-top:10px;padding:8px 10px;border:1px dashed var(--crit);color:var(--crit);font:500 12.5px/1.5 var(--font-m);
  background:repeating-linear-gradient(135deg,transparent 0 8px,var(--hatch) 8px 10px)}

/* headings and common bits */
.h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 8px}
.h h2{font:700 16px var(--font-d);letter-spacing:.14em;text-transform:uppercase}
.cnt{font:400 12px var(--font-m);color:var(--mute)}
.lab{font:600 12px var(--font-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line)}
.pad{padding:12px}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.btn{display:block;width:100%;min-height:52px;margin-top:12px;background:var(--ink);color:var(--bg);border:2px solid var(--ink);font-weight:600;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.lnk{background:none;border:0;padding:6px 0;min-height:36px;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px}

/* scenario list */
.slist{list-style:none;padding:0;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:68px;cursor:pointer}
.row:hover{background:var(--panel)}
.row .id{font:500 13px var(--font-m);color:var(--mute)}
.row .hz{display:block;font:600 11px var(--font-d);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.row .ttl{display:block;font-weight:600;font-size:16px;line-height:1.3}
.row .sub{display:block;font-size:12.5px;color:var(--mute);line-height:1.4;margin-top:2px}
.rt{display:grid;justify-items:end;gap:4px}
.dl{font:400 11.5px var(--font-m);color:var(--mute);white-space:nowrap}
.badge{font:500 11.5px var(--font-m);border:1px solid var(--line);padding:1px 6px;white-space:nowrap;color:var(--mute)}
.badge[data-v="match"],.badge[data-v="ok"]{color:var(--ok);border-color:var(--ok)}
.badge[data-v="late"]{color:var(--crit);border-color:var(--crit)}
.badge[data-v="over"]{color:var(--warn);border-color:var(--warn)}
.addrow{width:100%;margin-top:10px;min-height:48px;background:none;border:2px dashed var(--line);font-weight:600;cursor:pointer;color:var(--mute)}
.addrow:hover{border-color:var(--ink);color:var(--ink)}
.how{margin-top:20px;font-size:13px;color:var(--mute)}
.how b{color:var(--ink)}

/* run view */
.runtop{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.tag{font:500 11.5px var(--font-m);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.scard{margin-top:6px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.met{font:400 11.5px var(--font-m);color:var(--mute)}
.scard h1{font:600 22px/1.25 var(--font-b);margin:4px 0 6px;text-wrap:balance}
.scard p{font-size:14.5px}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:10px}
.v{background:var(--panel);padding:9px 12px 8px;min-width:0}
.v .val{display:flex;align-items:baseline;gap:5px;margin:2px 0 4px}
.v b{font:500 30px/1 var(--font-m);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.v u{text-decoration:none;font:400 11px var(--font-m);color:var(--mute)}
.v .meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.st{font:500 11.5px var(--font-m);white-space:nowrap}
.st::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;border:2px solid currentColor}
.v[data-s="ok"]{color:var(--ink)}
.v[data-s="ok"] .st{color:var(--ok)}
.v[data-s="warn"] .st,.v[data-s="warn"] b{color:var(--warn)}
.v[data-s="warn"] .st::before{background:currentColor}
.v[data-s="crit"] .st,.v[data-s="crit"] b{color:var(--crit)}
.v[data-s="crit"] .st::before{background:currentColor;transform:rotate(45deg)}
.spark{width:60px;height:18px;flex:none;overflow:visible}
.spark path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.v[data-s="ok"] .spark{color:var(--ok)}.v[data-s="warn"] .spark{color:var(--warn)}.v[data-s="crit"] .spark{color:var(--crit)}

.choices{list-style:none;padding:0;display:grid;gap:8px}
.ch{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;min-height:62px;
  background:var(--panel);border:2px solid var(--ink);padding:9px 12px;cursor:pointer}
.ch:hover,.ch:active{background:var(--ink);color:var(--bg)}
.ch .k{width:30px;height:30px;border:2px solid currentColor;display:grid;place-items:center;font:500 14px var(--font-m)}
.ch .n{display:block;font-weight:600;font-size:17px}
.ch .d{display:block;font-size:12.5px;opacity:.75;line-height:1.4}

.comm,.bud{padding:12px;margin-top:10px}
.cdrow{display:flex;align-items:flex-end;gap:12px;margin:6px 0 10px}
.cd{font:500 46px/1 var(--font-m);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cdl{font-size:12.5px;color:var(--mute);line-height:1.35;padding-bottom:4px}
.bar{height:14px;border:1px solid var(--ink);background:var(--bg);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--line) calc(10% - 1px) 10%)}
.bar.b{height:18px;margin-top:8px}
.bar.b[data-s="ok"] i{background:var(--ok)}.bar.b[data-s="warn"] i{background:var(--warn)}.bar.b[data-s="crit"] i{background:var(--crit)}
.bn{float:right;font:500 12px var(--font-m);color:var(--ink);letter-spacing:0;text-transform:none}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:13.5px}
.cb{display:flex;gap:14px}
.comm.dead{border:2px dashed var(--crit)}
.comm.dead .cd{color:var(--crit);animation:blink 1.6s steps(2,jump-none) infinite}
.comm.dead .lab{color:var(--crit)}
.bar.dead{border-style:dashed;border-color:var(--crit);background:repeating-linear-gradient(135deg,var(--panel) 0 6px,var(--hatch) 6px 12px)}
.bar.dead i,.bar.dead::after{display:none}
@keyframes blink{50%{opacity:.35}}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini button{min-height:46px;background:var(--panel);border:1px solid var(--ink);font-weight:500;font-size:13px;cursor:pointer;padding:0 2px}
.mini button[disabled]{background:var(--ink);color:var(--bg);cursor:default}

/* result */
.cmp{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);background:var(--panel)}
.cmp>div{padding:11px 12px;min-width:0}
.cmp>div+div{border-left:2px solid var(--ink)}
.cmp .big{font:600 24px/1.2 var(--font-b);margin:4px 0 6px;overflow-wrap:anywhere}
.cmp p{font-size:13.5px;line-height:1.5}
.cmp p+p{margin-top:8px;color:var(--mute)}
.cmp dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:10px;font:400 12px var(--font-m);color:var(--mute)}
.cmp dd{text-align:right;color:var(--ink)}
.cmp .nosig{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--hatch) 8px 10px);margin:-11px -12px;padding:11px 12px;height:calc(100% + 22px)}
.cmp .nosig .big{color:var(--crit);font-family:var(--font-m);font-size:20px}
.verdict{margin-top:10px;padding:10px 12px;border:2px solid;font-weight:600}
.verdict[data-v="match"],.verdict[data-v="ok"]{color:var(--ok)}
.verdict[data-v="late"]{color:var(--crit)}
.verdict[data-v="over"]{color:var(--warn)}
.verdict span{display:block;font-weight:400;font-size:13px;color:var(--ink);margin-top:2px}
.steps{list-style:none;padding:0;border-top:2px solid var(--ink)}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.step input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.step input:checked{background:var(--ink)}
.step input:checked::after{content:"";width:12px;height:6px;border-left:3px solid var(--bg);border-bottom:3px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.step b{display:block;font-size:15px}
.step span span{display:block;font-size:13px;color:var(--mute)}
.step input:checked+span{opacity:.55}
.esc{margin-top:10px;padding:9px 12px;border:1px solid var(--crit);color:var(--crit);font-size:13px}

.rec{border:2px solid var(--accent);padding:9px 12px;margin-top:6px}
.rec b{display:block}
.rec p{font-size:13px;color:var(--mute);margin-top:2px}
/* log + profile */
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.logrow time{font:400 11.5px var(--font-m);color:var(--mute)}
.logrow .t{font-weight:600}
.logrow .s{font-size:13px;color:var(--mute)}
.logrow .r{text-align:right;font:500 12px var(--font-m);color:var(--mute)}
.pill{display:inline-block;font:500 10.5px var(--font-m);border:1px solid var(--mute);padding:0 5px;margin-left:6px;color:var(--mute);vertical-align:1px}
.pill.red{color:var(--crit);border-color:var(--crit)}
.ptype{font:600 30px/1.2 var(--font-b);margin:6px 0 8px;text-wrap:balance}
.gauge{position:relative;height:30px;margin:18px 0 4px;border-block:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),var(--line) calc(12.5% - 1px) 12.5%)}
.gauge::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ink)}
.gauge .dot{position:absolute;top:-8px;bottom:-8px;width:6px;margin-left:-3px;background:var(--crit)}
.gl{display:flex;justify-content:space-between;gap:6px;font:500 11px var(--font-m);color:var(--mute)}
.dist{display:grid;grid-template-columns:92px 1fr 24px;gap:10px;align-items:center;margin-top:8px;font-size:13.5px}
.dist .bar{height:12px}
.dist .bar i{background:var(--ink)}
.dist em{font:500 12px var(--font-m);font-style:normal;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}
.stats div{background:var(--panel);padding:8px 10px}
.stats b{display:block;font:500 22px var(--font-m)}
.stats span{font-size:12px;color:var(--mute)}

/* form */
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px}
.f input,.f select,.f textarea{width:100%;min-height:44px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);padding:8px 10px;font:inherit;border-radius:0}
.f textarea{min-height:84px;resize:vertical}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--ink);
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:none;border:0;min-height:54px;cursor:pointer;font:600 13px var(--font-d);letter-spacing:.14em;text-transform:uppercase}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.comm.dead .cd{animation:none}.sw .t i{transition:none}}
</style>

<div class="app" id="app"></div>
<nav class="nav" id="nav"><div>
  <button data-a="tab" data-v="home">Scenarios</button>
  <button data-a="tab" data-v="log">Log</button>
  <button data-a="tab" data-v="profile">Profile</button>
</div></nav>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ---------- storage (per-viewer convenience only) ---------- */
var KEY='interim.en.v1',mem={};
function load(){try{var j=localStorage.getItem(KEY);return j?JSON.parse(j):mem}catch(e){return mem}}
function save(){mem={log:S.log,custom:S.custom};try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
var saved=load();
var S={view:'home',blackout:false,speed:12,log:saved.log||[],custom:saved.custom||[],run:null,armClear:false};

/* ---------- content ---------- */
var HAZ=[['H1','DISTANCE','Distance'],['H2','ISOLATION','Isolation'],['H3','CLOSED ENV','Closed environment'],['H4','GRAVITY','Gravity'],['H5','RADIATION','Radiation'],['H6','CARDIO','Cardiovascular']];
var ACTS=[
 {n:'Observe',d:'Watch the numbers, touch nothing. Set your escalation line first.'},
 {n:'Self-treat',d:'Use medication or a procedure yourself, with no help.'},
 {n:'Call crew',d:'Get a crewmate on scene to assess and act with you.'},
 {n:'Emergency',d:'Start the emergency protocol: med kit, oxygen, whole crew.'}];
var DUR=8,CAP=20,SPEEDS=[12,30];

function V(key,label,unit,start,ok,crit,dp,j,kind,max){return{key:key,label:label,unit:unit,start:start,ok:ok,crit:crit,dp:dp||0,j:j||0,kind:kind||'',max:max==null?999:max}}

var SC=[
{id:'s1',hz:0,title:'Chest pain + heart rate 112',met:'MET day 214, 03:42',delay:8,
 brief:'Ten minutes after treadmill training, a crushing pressure behind your sternum spreads to your left arm. You are sitting by the Node 2 wall. Your crewmates are working in another module.',
 vit:[V('hr','Heart rate','bpm',112,[55,100],[45,110],0,1.4),V('spo2','SpO2','%',95,[97,100],[92,101],0,.4,'',100),V('bp','Blood pressure','mmHg',148,[95,130],[85,160],0,1.5,'bp'),V('pain','Chest pain /10','pts',6,[0,3],[0,7],0,.12,'',10)],
 to:[[132,91,160,8],[120,94,152,6],[106,96,140,5],[94,98,128,3]],rate:[6.5,3.8,2.2,1],
 out:['You sit and wait. The pressure worsens, you break into a cold sweat, and your heart rate keeps climbing.','You chew an aspirin and stop moving, but nobody is with you and there is no ECG. The symptoms do not ease.','A crewmate arrives and helps you put on ECG patches and oxygen. The full emergency protocol has not started.','You hit the emergency call. Your crew arrives with the med kit, and ECG, oxygen and aspirin all start together. Your numbers begin to fall.'],
 ideal:3,ok:[],
 say:'Chest pain with a fast heart rate: do not wait for us. Treat it as a possible acute coronary event. Stop all activity, call for help, get an ECG, give oxygen, and chew aspirin as prescribed.',
 why:'This can turn into a dangerous arrhythmia within twenty minutes. Waiting for confirmation costs more than overreacting.',
 steps:[['Stop and sit steady','Stop all activity, secure your body, and do not move alone.'],['Call your crew','Press the module call button and ask for the med kit.'],['Oxygen + ECG','Give oxygen if SpO2 is below 97. Apply ECG patches and start recording.'],['Chew aspirin as prescribed','Confirm there is no bleeding risk first, then chew it and note the time.'],['Report every two minutes','Heart rate, SpO2, blood pressure and pain score go into the log while you wait for ground.']],
 esc:'Fainting, SpO2 below 92 or pain above 8: the whole crew goes to emergency protocol.'},

{id:'s2',hz:1,title:'Insomnia + low mood',met:'MET day 311, 22:10',delay:12,
 brief:'Fourth night shift in a row without sleep, only three and a half hours last night. You are not eating and cannot find the energy for the daily call. No pain, no other physical symptoms.',
 vit:[V('sleep','Sleep last night','h',3.5,[6,9],[4.5,10],1,0,'',24),V('mood','Mood /10','pts',3,[6,10],[4,10],0,.1,'',10),V('rhr','Resting HR','bpm',88,[55,85],[45,100],0,1),V('pvt','Reaction time PVT','ms',410,[200,300],[150,380],0,6)],
 to:[[3.5,2,92,440],[3.5,5,80,340],[3.5,6,78,330],[3.5,3,100,400]],rate:[3,1,1.2,3.2],
 out:['You decide to push through another night. Your mood sinks further and your reactions slow during the day.','You dim the lights, do ten minutes of breathing exercises, and go lights out on schedule. Your mood lifts a little.','You talk with a crewmate for fifteen minutes. The isolation eases, and someone now knows how you are doing.','You trigger the emergency protocol and a crewmate is woken. You feel more anxious and cannot say why you did it.'],
 ideal:1,ok:[2],
 say:'No physical danger signs. Handle it yourself first: fixed routine, dim lights, relaxation training. Schedule an informal chat call today.',
 why:'Sleep loss and low mood from isolation should be dealt with early, but this is not an emergency.',
 steps:[['Dim the lights, screens off','Start an hour before bed and keep the module lighting low.'],['Ten minutes of breathing','Four seconds in, six out, following the relaxation routine in the manual.'],['Log sleep and mood','Record last night’s sleep hours and today’s mood score.'],['Chat with a crewmate','No need to talk about being unwell. Just talk.']],
 esc:'Three nights in a row under four hours of sleep, or any thought of harming yourself: call your crew at once and contact ground.'},

];

/* ---------- custom scenarios ---------- */
var DIR={hr:1,spo2:-1,bp:-1,dis:1},MAG={hr:22,spo2:5,bp:16,dis:2.5};
var TPL=[
 {say:'Observe first: sit steady, record your numbers and set an escalation line. Do not rush to act.',steps:[['Sit steady','Put down what you are doing.'],['Log every five minutes','Heart rate, SpO2, blood pressure and discomfort score go into the log.'],['Write an escalation line','Decide in advance which changes mean you call for help.']]},
 {say:'Handle it yourself first: rest, follow the manual and recheck after ten minutes.',steps:[['Stop and rest','Put down what you are doing.'],['Treat per the manual','Use the matching procedure in the manual and note the time and dose.'],['Recheck after ten minutes','If there is no improvement, escalate.']]},
 {say:'Call your crew in and work through it together.',steps:[['Call your crew','Press the module call button.'],['Say three things','Symptoms, start time and current readings.'],['Treat together and recheck','Log your numbers every five minutes.']]},
 {say:'Start the emergency protocol straight away. Do not wait for ground to confirm.',steps:[['Hit the emergency call','Ask for the med kit, oxygen and ECG.'],['Stabilise vitals','Give oxygen, apply ECG and secure your body.'],['Report every two minutes','Heart rate, SpO2 and blood pressure go into the log.']]}];
function gen(f){
  var vit=[V('hr','Heart rate','bpm',f.hr,[55,100],[45,110],0,1.4),V('spo2','SpO2','%',f.spo2,[97,100],[92,101],0,.4,'',100),V('bp','Blood pressure','mmHg',f.sbp,[95,130],[85,160],0,1.5,'bp'),V('dis','Discomfort /10','pts',f.dis,[0,3],[0,7],0,.12,'',10)];
  var keys=['hr','spo2','bp','dis'];
  var good=vit.map(function(v){var s=v.start,w=v.ok[1]-v.ok[0];return s<v.ok[0]?v.ok[0]+w*.1:s>v.ok[1]?v.ok[1]-w*.1:s});
  var bad=vit.map(function(v,i){var s=v.start,d=s<v.ok[0]?-1:s>v.ok[1]?1:DIR[keys[i]];return Math.max(0,Math.min(v.max,s+d*MAG[keys[i]]))});
  var to=[],rate=[],out=[];
  for(var c=0;c<4;c++){
    var gap=f.ideal-c;
    to.push(vit.map(function(v,i){var s=v.start;return gap>0?s+(bad[i]-s)*Math.min(1,gap/2):gap===0?good[i]:s+(good[i]-s)*.7}));
    rate.push(gap>0?1.5+1.6*gap:gap===0?1:1.4+.5*(-gap));
    out.push(gap>0?'You chose too little. Your numbers keep moving the wrong way.':gap===0?'Your response matched the symptoms and your numbers begin to fall.':'Your numbers settle, but this step was heavier than needed and used crew time and medical supplies.');
  }
  var t=TPL[f.ideal];
  return{id:f.id,hz:f.hz,custom:true,title:f.title,met:'Custom scenario',delay:f.delay,brief:f.brief||'Custom scenario.',vit:vit,to:to,rate:rate,out:out,ideal:f.ideal,ok:[],
    say:t.say,why:'This is the reference answer you set.',steps:t.steps,esc:'Any clear worsening of the numbers: go up one level.'};
}
function allSc(){return SC.concat(S.custom.map(gen))}
function findSc(id){return allSc().filter(function(s){return s.id===id})[0]}
function firstSentence(s){var i=s.indexOf('. ');return i>-1?s.slice(0,i+1):s}

/* ---------- judging, status ---------- */
var VT={match:'Matches ground',ok:'Acceptable',late:'Too slow',over:'Overreaction'};
var STL={ok:'Normal',warn:'Caution',crit:'Danger'};
function judge(sc,c){
  if(c===sc.ideal)return{v:'match',diff:0};
  if(sc.ok.indexOf(c)>-1)return{v:'ok',diff:0};
  var d=c-sc.ideal;return{v:d<0?'late':'over',diff:d};
}
function stat(v,x){if(x>=v.ok[0]&&x<=v.ok[1])return'ok';if(x<v.crit[0]||x>v.crit[1])return'crit';return'warn'}
function fmt(v,x){if(v.kind==='bp'){var s=Math.round(x);return s+'/'+Math.round(s*.62)}return x.toFixed(v.dp)}
function mmss(m){var s=Math.max(0,Math.round(m*60));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function spark(h){
  var mn=Math.min.apply(null,h),mx=Math.max.apply(null,h);if(mx-mn<1e-6){mn-=1;mx+=1}
  return h.map(function(y,i){var px=h.length>1?i/(h.length-1)*60:0,py=16-(y-mn)/(mx-mn)*14;return(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}).join('');
}

/* ---------- state machine ----------
   brief --CHOOSE--> wait --REPLY/END--> result
   wait is where time passes: vitals drift toward the target of the chosen action,
   the body budget drains, and (unless the link is lost) the ground reply arrives. */
var T={brief:{CHOOSE:'wait'},wait:{REPLY:'result',END:'result'},result:{}};
function startRun(sc){
  S.run={sc:sc,phase:'brief',simT:0,cur:null,first:null,changes:[],base:sc.vit.map(function(v){return v.start}),vals:sc.vit.map(function(v){return v.start}),
    hist:sc.vit.map(function(v){return[v.start]}),budget:100,seg:null,blk:false,aided:false,ticks:{},res:null,last:performance.now(),hT:0};
  S.view='run';render();window.scrollTo(0,0);
}
function setSeg(c){var r=S.run;r.cur=c;r.seg={t0:r.simT,from:r.base.slice(),to:r.sc.to[c],rate:r.sc.rate[c]}}
function send(ev,arg){
  var r=S.run;if(!r)return;var nx=T[r.phase][ev];if(!nx)return;
  if(ev==='CHOOSE'){r.first=arg;setSeg(arg)}
  if(nx==='result')finish(arg||'reply');
  r.phase=nx;render();
  var p=$('#phase');if(p&&nx==='result')p.scrollIntoView({block:'start'});
}
function finish(reason){
  var r=S.run,j=judge(r.sc,r.first);
  r.res={reason:reason,j:j};
  S.log.unshift({id:Date.now(),ts:Date.now(),sid:r.sc.id,title:r.sc.title,hz:r.sc.hz,c:r.first,ideal:r.sc.ideal,v:j.v,diff:j.diff,blk:r.blk,budget:Math.round(r.budget),mins:+r.simT.toFixed(1),sw:r.changes.length,reason:reason,aided:r.aided});
  save();
}
function tick(){
  var r=S.run;if(!r||S.view!=='run')return;
  var now=performance.now(),dt=Math.min(.5,(now-r.last)/1000);r.last=now;
  if(r.phase==='wait'){
    var dm=dt*S.speed/60;r.simT+=dm;
    var p=Math.min(1,(r.simT-r.seg.t0)/DUR),e=1-Math.pow(1-p,2);
    r.base=r.sc.vit.map(function(v,i){return r.seg.from[i]+(r.seg.to[i]-r.seg.from[i])*e});
    r.budget=Math.max(0,r.budget-r.seg.rate*dm);
    if(S.blackout)r.blk=true;
  }
  if(r.phase==='result')return;
  var rt=now/1000;
  r.vals=r.sc.vit.map(function(v,i){var x=r.base[i]+v.j*(Math.sin(rt*7.1+i*1.7)*.6+Math.sin(rt*3.3+i)*.4);return Math.max(0,Math.min(v.max,x))});
  if(now-r.hT>250){r.hT=now;r.hist.forEach(function(h,i){h.push(r.vals[i]);if(h.length>48)h.shift()})}
  if(r.phase==='wait'){
    if(r.budget<=0){send('END','collapse');return}
    if(!S.blackout&&r.simT>=r.sc.delay){send('REPLY');return}
    if(S.blackout&&r.simT>=CAP){send('END','timeout');return}
  }
  live();
}
setInterval(tick,100);

function live(){
  var r=S.run;if(!r)return;
  r.sc.vit.forEach(function(v,i){
    var el=$('#v'+i);if(!el)return;
    var x=+r.vals[i].toFixed(v.dp),s=stat(v,x),d=r.base[i]-v.start,ar=Math.abs(d)>=Math.max(.5,Math.abs(v.start)*.015)?(d>0?' ↑':' ↓'):'';
    el.dataset.s=s;$('b',el).textContent=fmt(v,r.vals[i]);$('.st',el).textContent=STL[s]+ar;$('path',el).setAttribute('d',spark(r.hist[i]));
  });
  if(r.phase==='wait'){
    var cd=$('#cdText');if(!cd)return;
    cd.textContent=S.blackout?mmss(r.simT):mmss(r.sc.delay-r.simT);
    $('#cdBar').style.width=(Math.min(1,r.simT/r.sc.delay)*100)+'%';
    $('#bv').textContent=Math.round(r.budget);$('#bBar').style.width=r.budget+'%';
    $('#bBar').parentElement.dataset.s=r.budget>60?'ok':r.budget>30?'warn':'crit';
    var al=$('#alert');if(al)al.hidden=!(r.cur<3&&r.budget<70&&r.seg.rate>=2.5);
  }
}

/* ---------- profile ---------- */
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function prof(){
  var L=S.log.filter(function(e){return !e.aided});if(L.length<3)return null;
  var avg=mean(L.map(function(e){return e.diff}));
  var late=L.filter(function(e){return e.v==='late'}).length,over=L.filter(function(e){return e.v==='over'}).length;
  var good=L.filter(function(e){return e.v==='match'||e.v==='ok'}).length;
  var type,title,text;
  if(avg<=-.4){type='wait';title='You tend to over-wait';text='When symptoms get worse, you more often choose to sit and watch. For fast-moving problems like chest pain or radiation, escalate first and observe after. Set yourself a hard line: pain plus a heart rate above 100 means you call for help.'}
  else if(avg>=.4){type='over';title='You tend to over-react';text='You reach for the escalation button quickly. For mild symptoms that burns crew time and supplies, and it pushes your own heart rate up. Ask first: can lying down, drinking fluids and logging the numbers come first?'}
  else if(late&&over){type='swing';title='You swing early and late';text='Your judgement has no steady line. Sometimes you wait too long, sometimes you escalate too fast. Write your escalation lines down and work against them every time, instead of going on feel.'}
  else{type='calib';title='You are close to calibrated';text='Your choices mostly track the ground advice. Keep it up, then try the comms blackout and see whether you stay steady with nothing to check against.'}
  var cnt=[0,0,0,0];L.forEach(function(e){cnt[e.c]++});
  var B=L.filter(function(e){return e.blk}),N=L.filter(function(e){return !e.blk});
  return{type:type,title:title,text:text,avg:avg,good:good,late:late,over:over,cnt:cnt,n:L.length,bAvg:B.length?mean(B.map(function(e){return e.diff})):null,nAvg:N.length?mean(N.map(function(e){return e.diff})):null,bn:B.length};
}
function sg(x){return(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(1)}

/* ---------- views ---------- */
function guideSteps(r){return r.cur===r.sc.ideal?r.sc.steps:TPL[r.cur].steps}
function topHTML(){
  return '<header class="top"><div class="mark"><i></i><div><b>INTERIM</b><small>Comms-delay decision trainer</small></div></div>'+
   '<button class="sw" role="switch" aria-checked="'+S.blackout+'" data-a="blk"><span>Comms<br>blackout</span><span class="t"><i></i></span></button></header>'+
   '<div class="strip"><span>MET <b>day 214</b></span><span>Ground delay <b>8–12 min</b></span><span class="'+(S.blackout?'lost':'')+'">Link <b>'+(S.blackout?'LOST':'OK')+'</b></span></div>'+
   (S.blackout?'<div class="banner">Comms blackout is on: the countdown is gone and no ground advice will arrive. All you have is the offline manual and yourself.</div>':'');
}
function homeHTML(){
  var all=allSc(),done={};S.log.forEach(function(e){done[e.sid]=1});
  var n=all.filter(function(s){return done[s.id]}).length;
  return '<div class="h"><h2>Scenarios</h2><span class="cnt">'+n+' / '+all.length+' done</span></div><ol class="slist">'+
   all.map(function(s,i){
     var last=S.log.filter(function(e){return e.sid===s.id})[0],h=HAZ[s.hz];
     return '<li><button class="row" data-a="open" data-v="'+s.id+'"><span class="id">S'+(i+1)+'</span><span><span class="hz">'+h[0]+' '+h[1]+(s.custom?' · custom':'')+'</span><span class="ttl">'+esc(s.title)+'</span><span class="sub">'+esc(firstSentence(s.brief))+'</span></span>'+
      '<span class="rt"><span class="badge" data-v="'+(last?last.v:'')+'">'+(last?VT[last.v]:'Not done')+'</span><span class="dl">ground '+s.delay+'′</span></span></button></li>';
   }).join('')+'</ol><button class="addrow" data-a="new">+ New scenario</button>'+
   '<p class="how"><b>How it works:</b> pick a scenario, read the symptoms and numbers, and choose one of four responses. The clock starts, your numbers move and your body budget drains. When ground replies, compare it with your call. Finish 3 scenarios to get your decision profile. Stuck? Ask Interim before you choose, but aided calls are not scored.</p>'+
   '<p class="note">Training simulation. Numbers and advice are for teaching demos, not medical advice.</p>';
}
function vitHTML(){
  var r=S.run;
  return r.sc.vit.map(function(v,i){
    var x=+r.vals[i].toFixed(v.dp);
    return '<div class="v" id="v'+i+'" data-s="'+stat(v,x)+'"><div class="lab">'+esc(v.label)+'</div><div class="val"><b>'+fmt(v,r.vals[i])+'</b><u>'+esc(v.unit)+'</u></div><div class="meta"><span class="st"></span><svg class="spark" viewBox="0 0 60 18" aria-hidden="true"><path d=""/></svg></div></div>';
  }).join('');
}
function briefHTML(){
var r=S.run,fl=r.sc.vit.map(function(v,i){var x=+r.vals[i].toFixed(v.dp),s=stat(v,x);return s==='ok'?null:v.label+' '+fmt(v,r.vals[i])+' '+v.unit+' ('+STL[s]+')'}).filter(Boolean);
  var ai=r.aided?'<div class="rec"><b>Interim suggests: '+ACTS[r.sc.ideal].n+'</b><p>'+esc(r.sc.why)+'</p></div>':'<button class="lnk" data-a="aid">Ask Interim for a recommendation</button><p class="note" style="margin-top:0">Counts as aided. Aided decisions are not scored in your profile.</p>';
  return '<div class="h"><h2>Interim read-out</h2></div><div class="panel pad"><div class="lab">'+HAZ[r.sc.hz][0]+' '+HAZ[r.sc.hz][1]+'</div><p style="margin:4px 0 8px">Flagged: '+(fl.length?esc(fl.join(', ')):'nothing out of range')+'.</p>'+ai+'</div><div class="h"><h2>Your call</h2></div><ol class="choices">'+
   ACTS.map(function(a,i){return '<li><button class="ch" data-a="choose" data-v="'+i+'"><span class="k">'+(i+1)+'</span><span><span class="n">'+a.n+'</span><span class="d">'+a.d+'</span></span></button></li>'}).join('')+
   '</ol><p class="note">Once you choose, the clock starts. You cannot undo it, only change your call.</p>';
}
function waitHTML(){
  var r=S.run,b=S.blackout;
  return '<div class="panel comm'+(b?' dead':'')+'"><div class="lab">'+(b?'Ground reply · link lost':'Ground reply')+'</div>'+
   '<div class="cdrow"><div class="cd" id="cdText">--:--</div><div class="cdl">'+(b?'waited<br>no reply is coming':'remaining')+'</div></div>'+
   '<div class="bar'+(b?' dead':'')+'"><i id="cdBar"></i></div>'+
   '<div class="crow"><span>Current call <b>'+ACTS[r.cur].n+'</b></span><span class="cb"><button class="lnk" data-a="spd">Speed ×'+S.speed+'</button>'+(b?'':'<button class="lnk" data-a="skip">Skip ›</button>')+'</span></div></div>'+
   '<div class="panel bud"><div class="lab">Body budget<span class="bn"><b id="bv">100</b> / 100</span></div><div class="bar b" data-s="ok"><i id="bBar"></i></div></div>'+
   '<div class="esc" id="alert" hidden><b>Interim alert:</b> body budget is below 70 and still falling. Your numbers are not recovering.<button class="btn" data-a="swap" data-v="'+Math.min(3,r.cur+1)+'" style="margin-top:8px;min-height:44px">Escalate to '+ACTS[Math.min(3,r.cur+1)].n+'</button></div>'+
   '<div class="h"><h2>'+(b?'Do this now · offline protocol':'Do this now')+'</h2></div><ol class="steps">'+guideSteps(r).map(function(s,i){return '<li><label class="step"><input type="checkbox" data-i="'+i+'"'+(r.ticks[i]?' checked':'')+'><span><b>Step '+(i+1)+': '+esc(s[0])+'</b><span>'+esc(s[1])+'</span></span></label></li>'}).join('')+'</ol>'+
   '<div class="h"><h2>Change your call</h2></div><div class="mini">'+
   ACTS.map(function(a,i){return '<button data-a="swap" data-v="'+i+'"'+(i===r.cur?' disabled':'')+'>'+a.n+'</button>'}).join('')+'</div>'+
   (b?'<button class="btn ghost" data-a="end">End the wait and log my decision</button>':'');
}
function resultHTML(){
  var r=S.run,sc=r.sc,res=r.res,j=res.j,blk=r.blk,ref=blk?'The offline manual':'Ground';
  var vd={match:ref+' made the same call.',ok:'Workable. '+ref+' would choose “'+ACTS[sc.ideal].n+'”.',late:ref+' would choose “'+ACTS[sc.ideal].n+'”. You underestimated it.',over:ref+' would choose “'+ACTS[sc.ideal].n+'”. This step was heavier than needed.'};
  var why=res.reason==='collapse'?'Your body budget ran out. You are incapacitated.':res.reason==='timeout'?'Twenty minutes passed. Ground never replied.':'';
  var chg=r.changes.length?'<dt>Changes</dt><dd>'+r.changes.length+'×</dd>':'';
  var right=blk
   ?'<div class="nosig"><div class="lab">Ground · GND</div><div class="big">NO SIGNAL</div><p>Ground never replied.</p><p>Below is the checklist stored in the offline manual.</p></div>'
   :'<div><div class="lab">Ground advice · GND</div><div class="big">'+ACTS[sc.ideal].n+'</div><p>'+esc(sc.say)+'</p><p>'+esc(sc.why)+'</p></div>';
  return '<div class="h"><h2>Compare</h2></div>'+(why?'<p class="note" style="margin:-4px 0 8px;color:var(--crit)">'+why+'</p>':'')+
   '<div class="cmp"><div><div class="lab">Your call</div><div class="big">'+ACTS[r.first].n+'</div><p>'+esc(sc.out[r.first])+'</p><dl><dt>Budget left</dt><dd>'+Math.round(r.budget)+' / 100</dd><dt>Elapsed</dt><dd>'+mmss(r.simT)+'</dd>'+chg+'</dl></div>'+right+'</div>'+
   '<div class="verdict" data-v="'+j.v+'">'+VT[j.v]+'<span>'+vd[j.v]+'</span></div>'+
   '<div class="h"><h2>'+(blk?'Offline manual · checklist':'Action checklist')+'</h2></div><ol class="steps">'+
   sc.steps.map(function(s,i){return '<li><label class="step"><input type="checkbox"><span><b>Step '+(i+1)+': '+esc(s[0])+'</b><span>'+esc(s[1])+'</span></span></label></li>'}).join('')+'</ol>'+
   '<p class="esc"><b>Escalation line:</b> '+esc(sc.esc)+'</p>'+
   '<button class="btn" data-a="next">Next scenario</button><button class="btn ghost" data-a="exit">Back to scenarios</button>';
}
function runHTML(){
  var r=S.run,sc=r.sc,h=HAZ[sc.hz];
  var ph=r.phase==='brief'?briefHTML():r.phase==='wait'?waitHTML():resultHTML();
  return '<div class="runtop"><button class="lnk" data-a="exit">← '+(r.phase==='wait'?'Abandon':'Back')+'</button><span class="tag">'+h[0]+' '+h[1]+'</span></div>'+
   '<section class="scard"><div class="met">'+esc(sc.met)+' · ground delay '+sc.delay+' min</div><h1>'+esc(sc.title)+'</h1><p>'+esc(sc.brief)+'</p></section>'+
   '<section class="vit" id="vit">'+vitHTML()+'</section><section id="phase">'+ph+'</section>';
}
function logHTML(){
  var L=S.log;
  var rows=L.length?L.map(function(e){
    var d=new Date(e.ts),t=d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),h=HAZ[e.hz]||HAZ[0];
    return '<li class="logrow"><div><time>'+t+' · '+h[1]+'</time><div class="t">'+esc(e.title)+(e.blk?'<span class="pill red">BLACKOUT</span>':'')+(e.demo?'<span class="pill">DEMO</span>':'')+(e.aided?'<span class="pill">AIDED</span>':'')+'</div>'+
     '<div class="s">You chose “'+ACTS[e.c].n+'”, advised “'+ACTS[e.ideal].n+'” · '+VT[e.v]+(e.sw?' · '+e.sw+' change'+(e.sw>1?'s':''):'')+'</div></div>'+
     '<div class="r">budget<br>'+e.budget+'</div></li>';
  }).join(''):'<li class="note" style="padding:14px 0">Nothing logged yet. Run a scenario, or load demo entries on the Profile tab.</li>';
  return '<div class="h"><h2>Decision log</h2><span class="cnt">'+L.length+' entries</span></div><ol class="slist">'+rows+'</ol>'+
   (L.length?'<button class="btn ghost" data-a="clear">'+(S.armClear?'Tap again to confirm':'Clear log')+'</button>':'');
}
function profHTML(){
  var p=prof(),n=S.log.filter(function(e){return !e.aided}).length,na=S.log.length-n;
  if(!p)return '<div class="h"><h2>Decision profile</h2></div><div class="panel pad"><p>Finish at least 3 scenarios to generate a profile. You have '+n+' so far. Decisions made after asking Interim for a recommendation are not counted.</p><div class="bar" style="margin-top:10px"><i style="width:'+(n/3*100)+'%"></i></div></div>'+
   '<button class="btn ghost" data-a="demo">Load demo entries</button><p class="note">Demo entries are tagged “DEMO” in the log. Clear the log to remove them.</p>';
  var pos=Math.max(-2,Math.min(2,p.avg)),pct=(pos+2)/4*100;
  var blkLine='';
  if(p.bAvg!==null&&p.nAvg!==null)blkLine='<p class="note">With nothing from ground to check against, your average bias was '+sg(p.bAvg)+' levels. With ground, '+sg(p.nAvg)+'. '+(p.bAvg<p.nAvg-.3?'In blackout you are more likely to sit and wait.':p.bAvg>p.nAvg+.3?'In blackout you are more likely to escalate on impulse.':'There is little difference between the two.')+'</p>';
  else if(p.bn)blkLine='<p class="note">'+p.bn+' of these decisions were made in a comms blackout.</p>';
  return '<div class="h"><h2>Decision profile</h2><span class="cnt">from '+p.n+' decisions</span></div>'+
   '<div class="panel pad"><div class="lab">Your type</div><div class="ptype">'+p.title+'</div><p>'+p.text+'</p>'+
   '<div class="gauge" role="img" aria-label="Average bias '+sg(p.avg)+' levels"><i class="dot" style="left:'+pct+'%"></i></div><div class="gl"><span>← Over-waiting</span><span>Calibrated</span><span>Over-reacting →</span></div>'+
   '<div class="stats"><div><b>'+Math.round(p.good/p.n*100)+'%</b><span>Matched ground</span></div><div><b>'+p.late+'</b><span>Too slow</span></div><div><b>'+p.over+'</b><span>Overreactions</span></div></div></div>'+
   '<div class="h"><h2>Choice mix</h2></div>'+
   ACTS.map(function(a,i){return '<div class="dist"><span>'+a.n+'</span><div class="bar"><i style="width:'+(p.cnt[i]/p.n*100)+'%"></i></div><em>'+p.cnt[i]+'</em></div>'}).join('')+blkLine+
   '<p class="note">Average bias '+sg(p.avg)+' levels. Negative means you wait more than ground would. Positive means you escalate more.'+(na?' '+na+' aided decision'+(na>1?'s are':' is')+' not counted.':'')+'</p>';
}
function newHTML(){
  var o=HAZ.map(function(h,i){return '<option value="'+i+'">'+h[0]+' '+h[2]+'</option>'}).join('');
  var a=ACTS.map(function(x,i){return '<option value="'+i+'"'+(i===2?' selected':'')+'>'+x.n+'</option>'}).join('');
  return '<div class="h"><h2>New scenario</h2></div><form class="f" id="nf">'+
   '<label><span class="lab">Title</span><input id="f-t" maxlength="40" placeholder="e.g. Abdominal pain + fever"></label>'+
   '<label><span class="lab">Symptoms</span><textarea id="f-b" maxlength="220" placeholder="What happened, where, and who is nearby"></textarea></label>'+
   '<label><span class="lab">Hazard</span><select id="f-h">'+o+'</select></label>'+
   '<div class="two"><label><span class="lab">Heart rate bpm</span><input id="f-hr" type="number" inputmode="numeric" value="108"></label><label><span class="lab">SpO2 %</span><input id="f-sp" type="number" inputmode="numeric" value="95"></label></div>'+
   '<div class="two"><label><span class="lab">Systolic mmHg</span><input id="f-bp" type="number" inputmode="numeric" value="110"></label><label><span class="lab">Discomfort /10</span><input id="f-d" type="number" inputmode="numeric" value="5"></label></div>'+
   '<div class="two"><label><span class="lab">Ground delay (min)</span><input id="f-dl" type="number" inputmode="numeric" value="10"></label><label><span class="lab">Ground would say</span><select id="f-i">'+a+'</select></label></div>'+
   '<button class="btn" type="submit">Create scenario</button><button class="btn ghost" type="button" data-a="cancel" style="margin-top:0">Cancel</button></form>';
}
function render(){
  var v=S.view;
  $('#app').innerHTML=topHTML()+(v==='home'?homeHTML():v==='log'?logHTML():v==='profile'?profHTML():v==='new'?newHTML():runHTML());
  var nav=$('#nav');nav.hidden=(v==='run'||v==='new');
  nav.querySelectorAll('button').forEach(function(b){if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(v==='run')live();
}

/* ---------- events ---------- */
function num(id,lo,hi,d){var x=parseFloat($(id).value);if(isNaN(x))x=d;return Math.max(lo,Math.min(hi,x))}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,v=t.dataset.v;
  if(a==='tab'){S.run=null;S.view=v;S.armClear=false;render();window.scrollTo(0,0)}
  else if(a==='open'){startRun(findSc(v))}
  else if(a==='blk'){S.blackout=!S.blackout;render()}
  else if(a==='choose'){send('CHOOSE',+v)}
  else if(a==='aid'){if(S.run&&S.run.phase==='brief'){S.run.aided=true;render()}}
  else if(a==='swap'){var r=S.run;if(r&&r.phase==='wait'&&+v!==r.cur){r.changes.push(+v);r.ticks={};setSeg(+v);render()}}
  else if(a==='spd'){S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length];render()}
  else if(a==='skip'){if(S.run&&S.run.phase==='wait')S.run.simT=Math.max(S.run.simT,S.run.sc.delay)}
  else if(a==='end'){send('END','manual')}
  else if(a==='exit'){S.run=null;S.view='home';render();window.scrollTo(0,0)}
  else if(a==='next'){
    var all=allSc(),i=all.indexOf(findSc(S.run.sc.id)),done={};S.log.forEach(function(x){done[x.sid]=1});
    var nx=null;for(var k=1;k<=all.length;k++){var c=all[(i+k)%all.length];if(!done[c.id]){nx=c;break}}
    if(nx)startRun(nx);else{S.run=null;S.view='profile';render();window.scrollTo(0,0)}
  }
  else if(a==='new'){S.view='new';render();window.scrollTo(0,0)}
  else if(a==='cancel'){S.view='home';render()}
  else if(a==='clear'){
    if(S.armClear){S.log=[];S.armClear=false;save();render()}
    else{S.armClear=true;render();setTimeout(function(){if(S.armClear){S.armClear=false;if(S.view==='log')render()}},3000)}
  }
  else if(a==='demo'){
    var ids=[['s1',0,0,34],['s3',1,0,61],['s5',0,1,28],['s4',3,0,88],['s6',0,0,90]];
    ids.forEach(function(d,i){
      var sc=findSc(d[0]),j=judge(sc,d[1]);
      S.log.push({id:Date.now()+i,ts:Date.now()-(ids.length-i)*3600000,sid:sc.id,title:sc.title,hz:sc.hz,c:d[1],ideal:sc.ideal,v:j.v,diff:j.diff,blk:!!d[2],budget:d[3],mins:sc.delay,sw:0,reason:'reply',demo:true});
    });
    S.log.sort(function(x,y){return y.ts-x.ts});save();render();
  }
});
document.addEventListener('change',function(e){var t=e.target;if(t.matches&&t.matches('.step input[data-i]')&&S.run&&S.run.phase==='wait')S.run.ticks[t.dataset.i]=t.checked});
document.addEventListener('submit',function(e){
  if(e.target.id!=='nf')return;e.preventDefault();
  var f={id:'c'+Date.now(),hz:+$('#f-h').value,title:($('#f-t').value.trim()||'Custom scenario '+(S.custom.length+1)),brief:$('#f-b').value.trim(),
    hr:num('#f-hr',30,200,108),spo2:num('#f-sp',60,100,95),sbp:num('#f-bp',50,220,110),dis:num('#f-d',0,10,5),delay:num('#f-dl',8,20,10),ideal:+$('#f-i').value};
  S.custom.push(f);save();S.view='home';render();window.scrollTo(0,0);
});
render();
})();
</script>

</body></html>
